services:
  heimdall:
    build:
      context: .
      target: ${HEIMDALL_IMAGE_TARGET:-embeddings}
    image: heimdall:${HEIMDALL_IMAGE_TARGET:-embeddings}
    env_file:
      - .env
    environment:
      CHECKPOINT_PATH: /data/heimdall-checkpoints.sqlite
      HF_HOME: /data/hf
      KNOWLEDGE_DIR: /app/docs/knowledge
      HEIMDALL_LISTEN: 0.0.0.0:8080
      HEIMDALL_URL: http://127.0.0.1:8080
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data/heimdall-checkpoints.sqlite:/data/heimdall-checkpoints.sqlite
      - ./docs/knowledge:/app/docs/knowledge:ro
      - hf-cache:/data/hf
    networks:
      - lab
    # Optional host access to the control API (lab-internal by default):
    # ports:
    #   - "127.0.0.1:8080:8080"
    entrypoint: ["heimdall", "serve"]

networks:
  lab:
    external: true
    name: ${HEIMDALL_LAB_NETWORK:-lab}

volumes:
  hf-cache:
