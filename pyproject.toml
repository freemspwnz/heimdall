[project]
name = "heimdall"
version = "0.1.0"
description = "DevOps agent for a homelab"
readme = "README.md"
authors = [
    { name = "Freems", email = "maxfreeman228@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.10",
    "asyncpg>=0.29",
    "langgraph>=0.2",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "pydantic-settings>=2.4",
    "python-dotenv>=1.0",
]

[project.scripts]
heimdall = "heimdall.cli:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.8",
]
embeddings = [
    "sentence-transformers>=3.0",
    "torch",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = [
    "--cov=heimdall",
    "--cov-report=xml:coverage.xml",
    "--junitxml=junit.xml",
]

[tool.ruff]
target-version = "py312"
src = ["heimdall", "tests"]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["heimdall"]

[[tool.mypy.overrides]]
module = ["langgraph.*", "asyncpg.*", "sentence_transformers.*"]
ignore_missing_imports = true
