name: Docker Build

on:
  workflow_call:
    inputs:
      image-name:
        description: GHCR image name (without registry prefix)
        required: true
        type: string
      target:
        description: Dockerfile target (slim or embeddings)
        required: true
        type: string
      push:
        description: Push image to GHCR
        required: true
        type: boolean

# Permissions come from the caller (verify: packages read; publish: write + attestations).

jobs:
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Normalize GHCR namespace
        id: registry
        run: echo "owner=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: inputs.push
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ steps.registry.outputs.owner }}/${{ inputs.image-name }}
          flavor: |
            latest=false
          tags: |
            type=ref,event=tag,suffix=-${{ inputs.target }},enable=${{ inputs.push }}
            type=raw,value=${{ inputs.target }},enable=${{ inputs.push }}
            type=raw,value=latest,enable=${{ inputs.push && inputs.target == 'slim' }}
            type=raw,value=ci-${{ inputs.target }}-${{ github.sha }},enable=${{ !inputs.push }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ inputs.target }}
          push: ${{ inputs.push }}
          load: ${{ !inputs.push }}
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: ${{ inputs.push }}
          sbom: ${{ inputs.push }}
          cache-from: type=gha,scope=${{ inputs.target }}
          cache-to: type=gha,mode=max,scope=${{ inputs.target }}

      - name: Pull image for smoke
        if: inputs.push
        env:
          IMAGE: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          FIRST_IMAGE=$(echo "$IMAGE" | head -n1)
          docker pull "$FIRST_IMAGE"

      - name: Smoke test (linux/amd64)
        env:
          IMAGE: ${{ steps.meta.outputs.tags }}
          TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          # metadata may list multiple tags; take the first
          FIRST_IMAGE=$(echo "$IMAGE" | head -n1)
          docker image inspect "$FIRST_IMAGE" >/dev/null

          docker run --rm "$FIRST_IMAGE" --help
          docker run --rm --entrypoint python "$FIRST_IMAGE" -c "import heimdall"

          if [ "$TARGET" = "embeddings" ]; then
            docker run --rm --entrypoint python "$FIRST_IMAGE" -c "import sentence_transformers"
          fi
