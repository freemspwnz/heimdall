name: Docker Build

on:
  workflow_call:
    inputs:
      image-name:
        description: GHCR image name (without registry prefix)
        required: true
        type: string

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

jobs:
  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Normalize GHCR namespace
        id: registry
        run: echo "owner=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ steps.registry.outputs.owner }}/${{ inputs.image-name }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test (linux/amd64)
        env:
          IMAGE: ghcr.io/${{ steps.registry.outputs.owner }}/${{ inputs.image-name }}:${{ github.ref_name }}
        run: |
          set -euo pipefail
          docker pull --platform linux/amd64 "$IMAGE"

          docker run --rm --platform linux/amd64 "$IMAGE" \
            test -f /app/wednesday/main.py

          docker run --rm --platform linux/amd64 "$IMAGE" \
            test -f /app/alembic.ini

          docker run --rm --platform linux/amd64 --read-only \
            --tmpfs /tmp:rw,nosuid,size=64m \
            --tmpfs /var/tmp:rw,nosuid,size=64m \
            --tmpfs /run:rw,nosuid,size=16m \
            "$IMAGE" python3 -c "import sys; assert sys.dont_write_bytecode"

          docker run --rm --platform linux/amd64 --read-only \
            --tmpfs /tmp:rw,nosuid,size=64m \
            --tmpfs /var/tmp:rw,nosuid,size=64m \
            --tmpfs /run:rw,nosuid,size=16m \
            "$IMAGE" python3 -c "from infra.config import Config"

          docker run --rm --platform linux/amd64 "$IMAGE" \
            python3 -c "import importlib.util as u; assert u.find_spec('poetry') is None"
